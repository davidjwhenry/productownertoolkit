name: Prototype playground

on:
  pull_request:
    paths:
      - 'prototype-playground/**'
      - 'examples/**'
      - 'requirements/**'
      - 'design-system/**'
      - '.github/workflows/prototype-playground.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype-playground
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype-playground/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
