name: Prototype playground

on:
  pull_request:
    paths:
      - 'prototype-playground/**'
      - 'examples/**'
      - 'requirements/**'
      - 'design-system/**'
      - '.github/workflows/prototype-playground.yml'
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype-playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype-playground/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
